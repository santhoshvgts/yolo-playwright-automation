name: Playwright Tests

# Manual trigger only: Actions tab -> "Playwright Tests" -> "Run workflow".
on:
  workflow_dispatch:
    inputs:
      spec:
        description: 'Spec file(s) to run, space-separated (blank = all). e.g. tests/Vendor_Create.spec.js'
        required: false
        default: ''
        type: string
      grep:
        description: 'Only run tests whose title matches this text (blank = no filter)'
        required: false
        default: ''
        type: string
      base_url:
        description: 'Target environment URL'
        required: false
        default: 'https://invoice.test.vgts.xyz'
        type: string
      retries:
        description: 'Retries per failed test (config default on CI is 5)'
        required: false
        default: '1'
        type: choice
        options: ['0', '1', '2', '3', '5']

permissions:
  contents: read

# Tests share one test environment and one Rundata store — never run two at once.
# A second trigger waits in the queue instead of cancelling the running one.
concurrency:
  group: playwright-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Run Playwright tests
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Playwright's test runner executes on Node; Bun is the package manager
      # and command runner only.
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.1

      # No bun.lock in the repo: Bun migrates package-lock.json on the fly and
      # --frozen-lockfile guarantees the exact versions npm would install.
      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Get Playwright version
        id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}-chromium

      - name: Install Chromium + OS dependencies
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: bunx playwright install --with-deps chromium

      - name: Install OS dependencies (browser cached)
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: bunx playwright install-deps chromium

      - name: Run Playwright tests
        env:
          BASE_URL: ${{ inputs.base_url }}
          PASSWORD: ${{ secrets.PASSWORD }}
          # Login for the flow specs (purchase / sales / payment) — repo secrets
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          # Without this, runSafely swallows errors and failed flow tests report as passed
          STRICT: 'true'
          SPEC: ${{ inputs.spec }}
          GREP: ${{ inputs.grep }}
          RETRIES: ${{ inputs.retries }}
        run: |
          args=(--retries="$RETRIES")
          # Word-split SPEC on purpose so several files can be passed.
          [ -n "$SPEC" ] && read -ra specs <<< "$SPEC" && args+=("${specs[@]}")
          [ -n "$GREP" ] && args+=(--grep "$GREP")
          echo "bunx playwright test ${args[*]}"
          bunx playwright test "${args[@]}"

      - name: Write job summary
        if: always()
        run: |
          node -e '
            const fs = require("fs");
            const f = "test-results/results.json";
            if (!fs.existsSync(f)) { console.log("No results.json"); process.exit(0); }
            const r = JSON.parse(fs.readFileSync(f, "utf8"));
            const s = r.stats || {};
            const failed = [];
            const walk = (suite) => {
              (suite.specs || []).forEach(sp => sp.tests.forEach(t => {
                if (t.status === "unexpected") failed.push(`${sp.file} › ${sp.title}`);
              }));
              (suite.suites || []).forEach(walk);
            };
            (r.suites || []).forEach(walk);
            const lines = [
              "## Playwright results",
              "",
              "| Passed | Failed | Flaky | Skipped | Duration |",
              "|---|---|---|---|---|",
              `| ${s.expected ?? 0} | ${s.unexpected ?? 0} | ${s.flaky ?? 0} | ${s.skipped ?? 0} | ${Math.round((s.duration ?? 0) / 60000)} min |`,
            ];
            if (failed.length) lines.push("", "### Failed tests", "", ...failed.map(x => `- ${x}`));
            lines.push("", "Download the **playwright-report** artifact for the HTML report.");
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, lines.join("\n") + "\n");
          '

      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: test-results/html/
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload traces, screenshots and videos
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: test-results/artifacts/
          retention-days: 7
          if-no-files-found: ignore
