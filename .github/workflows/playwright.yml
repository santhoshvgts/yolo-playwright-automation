name: Playwright Tests

# Manual trigger only: Actions tab -> "Playwright Tests" -> "Run workflow".
on:
  workflow_dispatch:
    inputs:
      spec:
        description: 'Spec file to run (blank = all tests), e.g. tests/Product_item_Create.spec.js'
        required: false
        default: ''
      grep:
        description: 'Only run tests whose title matches this text (blank = no filter)'
        required: false
        default: ''
      base_url:
        description: 'Target environment URL'
        required: false
        default: 'https://invoice.test.vgts.xyz'

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Playwright still runs on Node; Bun is only the package manager/runner.
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.1

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Browser binaries are cached per lockfile; OS deps still install each run.
      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('bun.lock') }}

      - name: Install Playwright browsers
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: bunx playwright install --with-deps chromium

      - name: Install Playwright OS dependencies
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: bunx playwright install-deps chromium

      - name: Run Playwright tests
        env:
          BASE_URL: ${{ inputs.base_url }}
          PASSWORD: ${{ secrets.PASSWORD }}
          SPEC: ${{ inputs.spec }}
          GREP: ${{ inputs.grep }}
        run: |
          args=()
          [ -n "$SPEC" ] && args+=("$SPEC")
          [ -n "$GREP" ] && args+=(--grep "$GREP")
          bunx playwright test "${args[@]}"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: test-results/
          retention-days: 14
